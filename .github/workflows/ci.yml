name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools and age
        run: |
          sudo apt-get update -q && sudo apt-get install -yq age
          python -m pip install pytest==9.1.1 ruff==0.15.8
      - name: Shared backup sources match their manifest
        run: python scripts/sync_backups.py --check
      - name: Lint
        run: python -m ruff check .
      - name: Unit and integration tests
        run: python -m pytest -q

  sandbox:
    # Builds the real sandbox image and runs a complete task in it against a
    # scripted model: Docker isolation, gateway, OpenCode, checks, publication.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - name: End-to-end task in Docker
        run: python -m pytest -q -m docker tests/test_e2e_docker.py
