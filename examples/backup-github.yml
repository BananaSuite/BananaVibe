# Optional: encrypted backups of BananaVibe's task data. See docs/backups.md.
# Copy to .github/workflows/bananavibe-backup.yml in the issue repository.
name: BananaVibe backup
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
concurrency:
  group: bananavibe-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -yq age
      - name: Fetch the reviewed BananaVibe release
        env:
          BANANAVIBE_REVISION: ${{ vars.BANANAVIBE_REVISION }}
        run: |
          set -euo pipefail
          [[ "$BANANAVIBE_REVISION" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Set the BANANAVIBE_REVISION variable to a reviewed commit SHA.'; exit 1; }
          git init -q .bananavibe-tool
          git -C .bananavibe-tool -c core.hooksPath=/dev/null fetch -q --depth=1 https://github.com/BananaSuite/BananaVibe.git "$BANANAVIBE_REVISION"
          git -C .bananavibe-tool -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD
      - name: Back up
        env:
          BANANAVIBE_TOKEN: ${{ secrets.BANANAVIBE_BACKUP_READ_TOKEN }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_RECOVERY_KEY: ${{ secrets.BACKUP_RECOVERY_KEY }}
          BACKUP_REPO: ${{ vars.BACKUP_REPO }}
          BACKUP_FORGE: ${{ vars.BACKUP_FORGE }}
          BACKUP_NAME: ${{ vars.BACKUP_NAME }}
          BACKUP_USERNAME: ${{ vars.BACKUP_USERNAME }}
        run: python3 -P .bananavibe-tool/scripts/backup_action.py --config .bananavibe.toml
