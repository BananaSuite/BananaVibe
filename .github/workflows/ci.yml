name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install backup encryption tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age
      - name: Verify shared backup sources
        run: python3 scripts/sync_backups.py --check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --only-binary=:all: --no-deps --upgrade 'pip>=26.2.1'
      - run: python -m pip install -r requirements.txt pytest pyyaml ruff==0.16.6
      - name: Lint
        run: python -m ruff check .
      - run: python -m pytest -q
