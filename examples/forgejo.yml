# Copy to .forgejo/workflows/bananavibe.yml in the issue (control) repository.
name: BananaVibe
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      command:
        description: BananaVibe command
        default: /banana status
        required: true
jobs:
  bananavibe:
    if: >-
      github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/banana')
    # A dedicated Linux host runner (label bananavibe:host) with Python 3.11+,
    # Git and Docker. See docs/deployment.md.
    runs-on: bananavibe
    timeout-minutes: 75
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Pin to a reviewed release commit, or to a pinned mirror on your instance.
      - uses: https://github.com/BananaSuite/BananaVibe@v1.6.0
        env:
          BANANAVIBE_TOKEN: ${{ secrets.BANANAVIBE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
