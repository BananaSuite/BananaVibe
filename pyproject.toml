[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bananavibe"
dynamic = ["version"]
description = "Keep Claude Code, Codex or OpenCode working on a goal for days: supervised, verified, reviewed, and resilient to usage limits and outages."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Luca Zani and all contributors" }]
requires-python = ">=3.11"
# No runtime dependencies: standard library only.
dependencies = []
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/BananaSuite/BananaVibe"
Issues = "https://github.com/BananaSuite/BananaVibe/issues"

[project.scripts]
bananavibe = "bananavibe.cli:main"

[tool.setuptools]
packages = ["bananavibe"]

[tool.setuptools.dynamic]
version = { attr = "bananavibe.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "PLE", "RUF100"]
