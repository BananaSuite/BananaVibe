name: BananaVibe maintenance
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      command:
        description: BananaVibe command
        default: /banana status
        required: true
        type: string
permissions:
  contents: read
jobs:
  maintenance:
    if: >-
      github.event_name != 'issue_comment' ||
      startsWith(github.event.comment.body, '/banana ') ||
      startsWith(github.event.comment.body, '/bananavibe ') ||
      github.event.comment.body == '/banana' ||
      github.event.comment.body == '/bananavibe'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Pin the published BananaVibe commit before enabling the workflow.
      - uses: BananaSuite/BananaVibe@main
        env:
          BANANAVIBE_TOKEN: ${{ secrets.BANANAVIBE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
