version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps them from going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The sandbox base image is pinned by digest (Dockerfile.sandbox).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
