# .bananavibe.toml for BananaChat, with prompts kept in a private repository.
forge = "github"
control_repository = "BananaSuite/BananaChat-prompts"   # private: issues, guidance and state
target_repository = "BananaSuite/BananaChat"            # public: branches and draft PRs
base_branch = "main"
default_model = "coding"
prepare = [
  ["python3", "-m", "venv", "/state/venv"],
  ["/state/venv/bin/pip", "install", "-r", "requirements.txt", "pytest"],
]
checks = [["/state/venv/bin/python", "-m", "pytest", "-q"]]

[models.coding]
provider = "anthropic"
endpoint = "https://api.anthropic.com/v1"
model = "YOUR_MODEL_ID"
api_key_env = "ANTHROPIC_API_KEY"

[network]
allow = ["pypi.org", "files.pythonhosted.org"]
